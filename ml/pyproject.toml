[project]
name = "solar-vision-ml"
version = "0.1.0"
requires-python = ">=3.12,<3.15"
dependencies = [
  "numpy>=1.26,<3",
  "pillow>=10,<13",
  "scikit-learn>=1.4,<2",
  "matplotlib>=3.8,<4",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]
train = ["torch>=2.5,<3"]

[tool.uv]
default-groups = ["dev", "train"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
