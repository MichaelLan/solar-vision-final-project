[project]
name = "solar-vision-backend"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = ["fastapi>=0.115"]

[dependency-groups]
dev = ["workers-py", "workers-runtime-sdk", "pytest>=8", "ruff>=0.9", "httpx>=0.28"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
target-version = "py314"
line-length = 100
