[project]
name = "solar-vision-backend"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = ["fastapi>=0.115", "numpy>=2.4"]

[dependency-groups]
dev = ["workers-py", "workers-runtime-sdk", "pytest>=8", "ruff>=0.9", "httpx>=0.28"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.format]
# Generated by scripts/package_model.py; CI diffs it against a fresh export.
exclude = ["src/infra/model_payload.py"]
